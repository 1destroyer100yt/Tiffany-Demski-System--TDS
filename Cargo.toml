[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Andrew Detroyer"]
license = "MIT"
repository = "https://github.com/1destroyer100yt/Tiffany-Demski-System--TDS"

[workspace.dependencies]
tds_diagnostics = { path = "crates/tds_diagnostics" }
tds_lexer = { path = "crates/tds_lexer" }
tds_ast = { path = "crates/tds_ast" }
tds_parser = { path = "crates/tds_parser" }
tds_resolve = { path = "crates/tds_resolve" }
tds_check = { path = "crates/tds_check" }
tds_interp = { path = "crates/tds_interp" }
tds_cli = { path = "crates/tds_cli" }
insta = "1.49"
codespan-reporting = "0.13"
